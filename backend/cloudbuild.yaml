steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/my-image', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/my-image']
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/my-custom-sa@$PROJECT_ID.iam.gserviceaccount.com'
logsBucket: 'gs://my-custom-logs-bucket' # Replace with your bucket name
logging: CLOUD_LOGGING_ONLY