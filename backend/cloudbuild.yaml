steps:
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['builds', 'submit', '--tag', 'gcr.io/$PROJECT_ID/github.com/satyak2003/deepvision-detectionofdeepfakes']
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/deepvision-deploy@$PROJECT_ID.iam.gserviceaccount.com'
options:
  logging: CLOUD_LOGGING_ONLY